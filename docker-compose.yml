# Local development only. Defaults are public fixtures, never real credentials.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: northwind-support-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      # The API is inside Compose: localhost would point at itself, not SQL Server.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "${Jwt__SigningKey:-Local_Dev_Only_Replace_With_Random_Key_123456789}"
      Jwt__Issuer: "${Jwt__Issuer:-NorthwindSupportDesk}"
      Jwt__Audience: "${Jwt__Audience:-NorthwindSupportDeskWeb}"
      Jwt__LifetimeMinutes: "${Jwt__LifetimeMinutes:-60}"
      DevelopmentSeed__AgentPassword: "${DevelopmentSeed__AgentPassword:-Local_Dev_Login_123!}"
      Sla__BaseWindowHours__Low: "${Sla__BaseWindowHours__Low:-72}"
      Sla__BaseWindowHours__Medium: "${Sla__BaseWindowHours__Medium:-24}"
      Sla__BaseWindowHours__High: "${Sla__BaseWindowHours__High:-8}"
      Sla__BaseWindowHours__Critical: "${Sla__BaseWindowHours__Critical:-4}"
      Sla__PremiumCustomerMultiplier: "${Sla__PremiumCustomerMultiplier:-0.5}"
      Sla__MinimumWindowHours: "${Sla__MinimumWindowHours:-1}"
      Sla__AtRiskThresholdPercent: "${Sla__AtRiskThresholdPercent:-25}"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  supportdesk-sql:
